name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l internal cmd smoke)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        run: go test -race ./internal/proxy/

  build-artifact:
    name: build-artifact
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"

      - name: Build binary
        shell: bash
        run: |
          set -eu
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags='-s -w' -o gonka-proxy ./cmd/gonka-proxy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gonka-proxy-linux-amd64
          path: gonka-proxy
          if-no-files-found: error

  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build images
        run: docker compose -f compose.smoke.yaml build

      - name: Run container smoke test
        run: ./scripts/smoke-test.sh
